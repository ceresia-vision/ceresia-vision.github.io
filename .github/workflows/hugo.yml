# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ceresia-vision/ceres-backend
          ref: master
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          path: backend-source
          persist-credentials: false
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Build API documentation
        run: |
          docker build -t ceres-backend-docs ./backend-source
          npm install --global redoc-cli@0.13.21
          mkdir -p public/api/v1 public/api/v2
          for version in v1 v2; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD/backend-source:/output" --entrypoint python \
              ceres-backend-docs manage.py spectacular \
              --urlconf grapevis.public_schema_urls \
              --custom-settings grapevis.public_schema_urls.SPECTACULAR_SETTINGS \
              --file "/output/schema_${version}.yaml" --lang en --api-version "$version"
            redoc-cli build "backend-source/schema_${version}.yaml" \
              -o "public/api/${version}/index.html" --title "Ceres Public API ${version}" \
              --template templates/redoc.hbs \
              --templateOptions.siteUrl "${{ steps.pages.outputs.base_url }}/" \
              --disableGoogleFont \
              --options.theme.colors.primary.main='#5e5ce6' \
              --options.theme.colors.text.primary='#202124' \
              --options.theme.typography.fontFamily='Inter, Helvetica Neue, Arial, sans-serif' \
              --options.theme.typography.headings.fontFamily='Inter, Helvetica Neue, Arial, sans-serif' \
              --options.theme.sidebar.backgroundColor='#ffffff' \
              --options.theme.sidebar.textColor='#62656d' \
              --options.theme.rightPanel.backgroundColor='#ffffff' \
              --options.theme.rightPanel.textColor='#202124'
          done
          cp public/api/v2/index.html public/api/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
